trigger:
- main

pr:
  branches:
    include:
    - main

jobs:
- job: BuildApp
  displayName: 'Build Application'
  steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Install Node.js'

  - task: SonarQubePrepare@5
    inputs:
      SonarQube: 'tyrerunner'
      scannerMode: 'CLI'
      configMode: 'manual'
      cliProjectKey: 'GLA-SH22_GLA-SH22_8f4a9875-9701-4a50-83a8-d9f637b8e497'
      cliProjectName: 'tyrerunner'
      cliSources: 'tyre-runner-webapp'
        
  - script: |
      cd tyre-runner-webapp
      npm ci
      npm run build
    displayName: 'Install and Build App'

  - task: CopyFiles@2
    inputs:
      sourceFolder: '$(Build.SourcesDirectory)/tyre-runner-webapp/' 
      targetFolder: '$(Build.ArtifactStagingDirectory)' 
    displayName: 'Copy build output'

  - task: ArchiveFiles@2
    inputs:
      rootFolderOrFile: '$(Build.ArtifactStagingDirectory)' 
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/astro-app-artifact.zip'
      replaceExistingArchive: true 

  - task: PublishPipelineArtifact@1
    inputs:
      artifactName: 'astro-app-artifact'
      targetPath: '$(Build.ArtifactStagingDirectory)/astro-app-artifact.zip'

