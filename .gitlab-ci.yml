stages: 
  - setup 
  - triggers
  - test

generate-config:
  stage: setup
  image: ruby:2.7.2
  script:
    - ruby write-config.rb
    - git status
    - cat .node-gitlab-ci.yml
  artifacts:
    paths:
      - .node-gitlab-ci.yml

backend-requirements:
  stage: setup
  image: python:latest
  script:
    - pip freeze > requirements.txt
  artifacts:
    paths:
      - requirements.txt
    untracked: false
    when: on_success

triggers-node-build:
  stage: triggers
  trigger:
    include:
    - artifact: .node-gitlab-ci.yml
      job: generate-config

backend-python-unit-test:
  stage: test
  image: python:latest
  script:
    - python -m pip install -r requirements.txt
    - python -m coverage run -m unittest discover ./backend
    - python -m coverage xml -o CICD/report.xml 

  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: CICD/report.xml
    expire_in: 30 days


