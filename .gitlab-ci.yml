# Define the Docker image to use for the entire pipeline.
image: node:lts 

# Define the stages of your pipeline.
stages:
- build
# - deploy

# Define jobs for each stage.
build:
  stage: build
  script:
  - cd tyre-runner-webapp
  - npm install
  - npm run build
  artifacts:
    paths:
      - tyre-runner-webapp/public
  # only:
  #   - main