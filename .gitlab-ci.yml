stages:
  - setup
  - triggers

generate-config:
  stage: setup
  image: ruby:2.7.2
  script:
    - ruby write-config.rb
    - git status
    - cat .node-gitlab-ci.yml
  artifacts:
    paths:
      - .node-gitlab-ci.yml

triggers-node-build:
  stage: triggers
  trigger:
    include:
      - artifact: .linux-gitlab-ci.yml
        job: generate-config

