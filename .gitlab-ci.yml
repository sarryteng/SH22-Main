stages:
  - setup
  - triggers

generate-config:
  stage: setup
  script:
    - chmod +x write-config.rb && ./write-config.rb
    - git status
    - cat .node-gitlab-ci.yml
  artifacts:
    paths:
      - .node-gitlab-ci.yml

triggers-node-build:
  stage: triggers
  trigger:
    include:
      - artifact: .linux-gitlab-ci.yml
        job: generate-config

