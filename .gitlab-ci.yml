stages: 
  - setup 
  - triggers
  - test

generate-config:
  stage: setup
  image: ruby:2.7.2
  script:
    - ruby write-config.rb
    - git status
    - cat .node-gitlab-ci.yml
  artifacts:
    paths:
      - .node-gitlab-ci.yml

triggers-node-build:
  stage: triggers
  trigger:
    include:
    - artifact: .node-gitlab-ci.yml
      job: generate-config

backend-python-unit-test:
  stage: test
  image: python:latest
  script:
    - pip install pytest pytest-cov
    - python -m pytest --junitxml=CICD/report.xml --cov=backend
  artifacts:
    when: always
    reports:
      junit: CICD/report.xml
    expire_in: 30 days


