stages: 
  -  setup 
  -  trigger

generate-config:
  stage: setup
  image: ruby:2.7.2
  script:
    - ruby write-config.rb
    - git status
    - cat .node-gitlab-ci.yml
  artifacts:
    paths:
      - .node-gitlab-ci.yml

triggers-node-build:
  stage: trigger
  trigger:
    include:
    - artifact: .node-gitlab-ci.yml
      job: generate-config
